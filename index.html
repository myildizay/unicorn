const HEAD_H=64;

const P={x:130,y:0,r:24,vy:0,onGround:true};
const BODY=40; // head center -> feet
const FLOOR=()=>GROUND-BODY;
const GRAV=0.9,JUMP=-17.5;
let unis=[],clouds=[],stars=[],score=0,best=0,speed=6,spawnT=0,state='start',t=0;
try{best=+localStorage.getItem('uniBest')||0}catch(e){}

for(let i=0;i<5;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*120,s:0.6+Math.random()*0.8});

function reset(){unis=[];stars=[];score=0;speed=6;spawnT=60;P.y=FLOOR();P.vy=0;P.onGround=true;state='play'}
P.y=FLOOR();

function jump(){
  if(state!=='play'){reset();return}
  if(P.onGround){P.vy=JUMP;P.onGround=false}
}
addEventListener('keydown',e=>{
  if(e.key!=='ArrowUp')return;
  e.preventDefault();jump();
});
cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.focus();jump();});
cv.focus();

function spawn(){
  const big=Math.random()<0.3;
  const s=(big?1.25:0.9+Math.random()*0.2)*0.7;
  unis.push({x:W+60,w:80*s,h:70*s,s,hue:Math.random()*360,passed:false,leg:0});
}

function drawUnicorn(u){
  const s=u.s;ctx.save();ctx.translate(u.x,GROUND);ctx.scale(-s,s); // facing left (toward player)
  const bob=Math.sin(t*0.4+u.x*0.05)*3;
  // legs
  ctx.fillStyle='#f4f0ff';
  const l=Math.sin(t*0.5)*8;
  [[-25,l],[-12,-l],[12,l],[25,-l]].forEach(([lx,o])=>{ctx.save();ctx.translate(lx,-28+bob);ctx.rotate(o*0.03);ctx.fillRect(-4,0,8,28);ctx.fillStyle='#b48ad8';ctx.fillRect(-4,22,8,6);ctx.fillStyle='#f4f0ff';ctx.restore()});
  // body
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.ellipse(0,-40+bob,36,20,0,0,Math.PI*2);ctx.fill();
  // tail (rainbow)
  for(let i=0;i<5;i++){ctx.strokeStyle=`hsl(${(u.hue+i*50)%360},90%,65%)`;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-34,-46+bob);ctx.quadraticCurveTo(-55,-50+i*4+bob,-50,-20+i*3+bob);ctx.stroke()}
  // neck + head
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.moveTo(20,-52+bob);ctx.lineTo(38,-80+bob);ctx.lineTo(48,-74+bob);ctx.lineTo(34,-40+bob);ctx.fill();
  ctx.beginPath();ctx.ellipse(48,-80+bob,16,10,0.3,0,Math.PI*2);ctx.fill();
  // eye
  ctx.fillStyle='#2a1a3a';ctx.beginPath();ctx.arc(50,-83+bob,2.5,0,Math.PI*2);ctx.fill();
  // horn
  ctx.fillStyle='#ffd34d';ctx.beginPath();ctx.moveTo(42,-88+bob);ctx.lineTo(52,-112+bob);ctx.lineTo(48,-87+bob);ctx.fill();
  // mane
  for(let i=0;i<4;i++){ctx.fillStyle=`hsl(${(u.hue+i*70)%360},90%,70%)`;ctx.beginPath();ctx.arc(34-i*5,-80+i*9+bob,6,0,Math.PI*2);ctx.fill()}
  ctx.restore();
}

function drawPlayer(){
  const run=P.onGround?Math.sin(t*0.45):0.7;
  const r=P.r, skin='#f1c7a8';
  ctx.save();ctx.translate(P.x,P.y);ctx.scale(-1,1); // mirror: face right
  const sh=Math.max(0.3,1-(FLOOR()-P.y)/250);
  ctx.fillStyle='#0003';ctx.beginPath();ctx.ellipse(0,GROUND-P.y,20*sh,5*sh,0,0,Math.PI*2);ctx.fill();
  ctx.lineCap='round';ctx.lineJoin='round';
  const top=r-4, hip=r+18;
  // short chubby legs (tights) + small shoes pointing left
  [[run,'#7a6a8c'],[-run,'#8c7ca0']].forEach(([a,col])=>{
    ctx.strokeStyle=col;ctx.lineWidth=8;
    const fx=-a*7,fy=BODY-4;
    ctx.beginPath();ctx.moveTo(a>0?-4:4,hip);ctx.lineTo(fx,fy);ctx.stroke();
    ctx.fillStyle='#e85d75';ctx.beginPath();ctx.ellipse(fx-3,fy+1,7,4.5,0,0,Math.PI*2);ctx.fill();
  });
  // back arm (short)
  ctx.strokeStyle='#e6d7c2';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(4,top+6);ctx.lineTo(4+run*7,top+17);ctx.stroke();
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(4+run*7,top+19,3.5,0,Math.PI*2);ctx.fill();
  // round little-kid torso: cream jacket, slightly rounded belly
  ctx.fillStyle='#f6ead8';
  ctx.beginPath();ctx.moveTo(-10,top);ctx.quadraticCurveTo(0,top-3,10,top);
  ctx.quadraticCurveTo(16,hip-6,13,hip+3);ctx.quadraticCurveTo(0,hip+7,-13,hip+3);
  ctx.quadraticCurveTo(-17,hip-6,-10,top);ctx.fill();
  ctx.strokeStyle='#dcc6a6';ctx.lineWidth=1.5;ctx.stroke();
  // zipper + collar
  ctx.beginPath();ctx.moveTo(-1,top+1);ctx.lineTo(-1,hip+4);ctx.stroke();
  ctx.fillStyle='#4a3b55';ctx.beginPath();ctx.ellipse(-1,top+1,5,3,0,0,Math.PI);ctx.fill();
  // front arm (short)
  ctx.strokeStyle='#f6ead8';ctx.lineWidth=7;
  ctx.beginPath();ctx.moveTo(-4,top+6);ctx.lineTo(-4-run*7,top+17);ctx.stroke();
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(-4-run*7,top+19,3.5,0,Math.PI*2);ctx.fill();
  // full head cut-out from the photo (no frame)
  if(img.complete&&img.naturalWidth){
    const hw=HEAD_H*img.naturalWidth/img.naturalHeight;
    ctx.drawImage(img,-hw/2-4,top+6-HEAD_H,hw,HEAD_H);
  }
  ctx.restore();
}

function hit(u){
  // unicorn hitbox (body + head), circle-rect test
  const rx=u.x-u.w*0.55,ry=GROUND-u.h*1.15,rw=u.w*1.0,rh=u.h*1.15;
  const hx=P.x-P.r*0.9,hy=P.y-(HEAD_H-P.r-2)+6,hw=P.r*1.8,hh=(HEAD_H-P.r-2)-6+BODY-4;
  return hx<rx+rw&&hx+hw>rx&&hy<ry+rh&&hy+hh>ry;
}

function update(){
  t++;
  clouds.forEach(c=>{c.x-=c.s*(state==='play'?speed*0.15:0.5);if(c.x<-120){c.x=W+80;c.y=30+Math.random()*120}});
  if(state!=='play')return;
  P.vy+=GRAV;P.y+=P.vy;
  if(P.y>=FLOOR()){P.y=FLOOR();P.vy=0;P.onGround=true}
  if(--spawnT<=0){spawn();spawnT=Math.max(45,110-speed*5)+Math.random()*60}
  unis.forEach(u=>{u.x-=speed;
    if(!u.passed&&u.x+u.w*0.6<P.x-P.r){u.passed=true;score++;for(let i=0;i<10;i++)stars.push({x:P.x,y:P.y,vx:(Math.random()-.5)*6,vy:-Math.random()*6,l:40,h:Math.random()*360})}
    if(hit(u)){state='over';if(score>best){best=score;try{localStorage.setItem('uniBest',best)}catch(e){}}}
  });
  unis=unis.filter(u=>u.x>-150);
  stars.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.vy+=0.2;s.l--});stars=stars.filter(s=>s.l>0);
  speed=6+score*0.25;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  // clouds
  ctx.fillStyle='#ffffffcc';
  clouds.forEach(c=>{ctx.beginPath();ctx.arc(c.x,c.y,22*c.s,0,7);ctx.arc(c.x+25*c.s,c.y-10*c.s,28*c.s,0,7);ctx.arc(c.x+52*c.s,c.y,22*c.s,0,7);ctx.fill()});
  // ground
  ctx.fillStyle='#7ed957';ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#5fbf3c';
  const off=(t*(state==='play'?speed:0))%40;
  for(let x=-off;x<W;x+=40)ctx.fillRect(x,GROUND,20,6);
  unis.forEach(drawUnicorn);
  drawPlayer();
  stars.forEach(s=>{ctx.fillStyle=`hsla(${s.h},90%,60%,${s.l/40})`;ctx.fillRect(s.x,s.y,5,5)});
  // HUD
  ctx.fillStyle='#2a1a3a';ctx.font='bold 26px system-ui';ctx.textAlign='right';
  ctx.fillText('Skor: '+score,W-20,40);ctx.font='16px system-ui';ctx.fillText('En iyi: '+best,W-20,64);
  ctx.textAlign='center';
  if(state!=='play'){
    ctx.fillStyle='#0007';ctx.fillRect(0,0,W,H);ctx.fillStyle='#fff';
    ctx.font='bold 44px system-ui';
    ctx.fillText(state==='start'?'🦄 Unicorn Atlama 🦄':'Oyun Bitti!',W/2,H/2-20);
    ctx.font='22px system-ui';
    ctx.fillText(state==='start'?'Başlamak için ↑ tuşuna bas ya da tıkla':'Skor: '+score+'  —  Tekrar için ↑ / tıkla',W/2,H/2+25);
  }
}
(function loop(){update();draw();requestAnimationFrame(loop)})();
</script>
